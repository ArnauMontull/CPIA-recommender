<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe interactivo del recomendador CPIA</title>
<style>
:root{--bg:#f7f7f4;--fg:#1c1f26;--mut:#5d6470;--card:#ffffff;--line:#d9dbe0;--a:#2f5fd0;--b:#d98324;--c:#8d939e;--ok:#177a45;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--fg:#e8eaee;--mut:#9aa1ad;--card:#1d2027;--line:#333844;--a:#7aa2ff;--b:#f0a54a;--c:#8f96a3;--ok:#4cc38a;--bad:#ff7b72}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left))}
h1{font:600 28px/1.2 Georgia,serif;margin:.2em 0}h2{font:600 19px/1.3 system-ui;margin:1.6em 0 .5em}
.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.tile .n{font:600 28px Georgia,serif}.tile .l{color:var(--mut);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}label{font-size:14px}select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font:12px system-ui}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;display:none;z-index:9}
.leg span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:13px}.leg i{width:11px;height:11px;border-radius:2px;display:inline-block}
</style></head><body><main>
<h1>Recomendador Two-Tower: informe interactivo</h1>
<div class="mut" id="sub"></div>
<div class="tiles" id="tiles"></div>

<h2>Comparación de métodos</h2>
<div class="card"><div class="ctl">
<label>Partición <select id="selPart"><option>Test</option><option>Val</option></select></label>
<label>Relevante <select id="selDef"><option value="positivo (C2)">positivo (C2)</option><option value="rating ≥ 4 (C7)">rating ≥ 4 (C7)</option></select></label>
<label>Métrica <select id="selFam"><option value="Recall">Recall@k</option><option value="NDCG">NDCG@k</option></select></label></div>
<div class="leg" id="legM"></div><div class="sc"><svg id="barras" viewBox="0 0 820 300"></svg></div>
<div class="sc"><table id="tabM"></table></div></div>

<h2>Variabilidad entre semillas</h2>
<div class="card"><div class="ctl"><label>Métrica <select id="selSem"></select></label></div>
<div class="sc"><svg id="semillas" viewBox="0 0 820 220"></svg></div><div class="sc"><table id="tabS"></table></div></div>

<h2>Curvas de entrenamiento</h2>
<div class="card"><div class="ctl"><label>Mostrar <select id="selCur"><option value="recall200">Recall@200 (validación)</option><option value="perdida">Pérdida</option></select></label></div>
<div class="leg" id="legC"></div><div class="sc"><svg id="curvas" viewBox="0 0 820 300"></svg></div></div>

<h2>Significación (bootstrap de usuarios)</h2><div class="card" id="boot"></div>
<h2>Arranque en frío</h2><div class="card" id="frio"></div>
<h2>Watchlist</h2><div class="card" id="wl"></div>
<h2>Comprobaciones</h2><div class="card" id="comp"></div>
<h2>Glosario</h2><div class="card"><div class="ctl"><label>Buscar <input id="busca" type="search" placeholder="métrica, variable o término…" style="min-width:260px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px"></label></div><div id="glo"></div></div>
<div class="tip" id="tip"></div>
<p class="mut" id="pie"></p>

a para la demo con perfiles reales."], ["Datos", "Catálogo", "Las 23 335 películas que tienen al menos 20 valoraciones en MovieLens. Son las únicas que el modelo puede recomendar."], ["Datos", "user_idx / item_idx", "Números enteros contiguos (0, 1, 2…) que identifican a cada usuario y a cada película dentro del código. Se usan en lugar de los identificadores originales (userId, movieId) porque indexan tablas y matrices."], ["Datos", "movieId / tmdbId", "Identificador de una película en MovieLens / en TMDB. El catálogo guarda ambos, y el segundo permite emparejar películas de Letterboxd por la API de TMDB."], ["Datos", "Partición (train / val / test)", "Reparto de las valoraciones de cada usuario por orden temporal: el 80 % más antiguo es train (entrenamiento), el 10 % siguiente val (validación, para decidir cuándo parar) y el último 10 % test (evaluación final, que nunca se usa para entrenar ni decidir)."], ["Datos", "Reparto por usuario y tiempo", "Cada usuario se reparte por separado y por fecha, de modo que el modelo nunca aprende de valoraciones posteriores a las que se le piden predecir."], ["Datos", "Usuario elegible", "Usuario con al menos un positivo en train y al menos una película relevante en la partición que se evalúa. Solo ellos cuentan en las métricas, para no promediar usuarios sin nada que acertar."], ["Datos", "Submuestra de 20 000 usuarios", "Para ahorrar tiempo, las métricas se calculan con 20 000 usuarios elegibles elegidos al azar con una semilla fija; son los mismos para todos los métodos, de modo que la comparación es justa."], ["Datos", "media_u", "Media de las valoraciones de entrenamiento de un usuario. Mide si puntúa alto o bajo en general y sirve para decidir qué le gusta (un 4 es «poco» para quien da muchos 5)."], ["Datos", "Positivo (relevante «positivo»)", "Valoración r ≥ min(4, media_u): lo que se considera que le gusta al usuario. La definición alternativa del informe es «rating ≥ 4», un umbral fijo."], ["Datos", "Nota baja", "Valoración r ≤ media_u − 1 que no es positiva. Se usa como señal de «no le gusta» (bolsa B)."], ["Datos", "Zona neutra", "Valoraciones que no son ni positivas ni notas bajas. Entran en el historial con peso reducido (0,25)."], ["Datos", "Peso de un ejemplo", "Importancia de un positivo de entrenamiento en la pérdida: (1 + max(0, r − media_u)) × 0,75 si es de las primeras 24 horas del usuario, sin el 0,75 si no. Premia las valoraciones muy por encima de la media del usuario."], ["Datos", "Bolsa A / bolsa B", "Resumen del historial de un usuario como dos «bolsas» de películas con pesos: la A reúne sus positivos y neutras (lo que le gusta o no le disgusta) y la B sus notas bajas (lo que no le gusta). El orden dentro de la bolsa no importa."], ["Datos", "Historial y vista train / train_val", "Películas que se le dan al modelo como entrada para describir a un usuario. En validación es solo lo de train; en test, train más validación (vista train_val), que es lo realista."], ["Datos", "Máscara de valorados (C14)", "Conjunto de películas que el usuario ya ha valorado. Se excluyen siempre de las recomendaciones al evaluar, y en el entrenamiento se descartan como negativos."], ["Datos", "Película fría", "Película sin valoraciones en train. El modelo no ha podido aprender su identificador, así que su vector sale solo de su contenido (director, reparto, sinopsis…)."], ["Datos", "Usuario frío / arranque en frío", "Usuario que no estaba en el entrenamiento. Se le da una parte de su historia (80 %) y se mide si el modelo acierta lo que vio después (20 %). Comprueba que el modelo sirve para gente nueva sin reentrenar."], ["Datos", "Watchlist", "Lista de películas que un usuario de Letterboxd marcó como «quiero ver». El modelo nunca la usa como entrada; se emplea para una evaluación sin etiquetas."], ["Datos", "Emparejado exacto / por API", "Forma de reconocer una película de Letterboxd en el catálogo: por título y año normalizados (exacto) o, si falla, buscando en TMDB (API). El exacto no une títulos distintos de la misma película."], ["Modelo", "Two-Tower (dos torres)", "Arquitectura de recomendación con dos redes: una convierte a cada película en un vector (torre de ítem) y otra a cada usuario en otro vector del mismo espacio (torre de usuario). La afinidad es el producto escalar de ambos."], ["Modelo", "Vector / embedding", "Lista de números (aquí 128) que representa a una película o a un usuario. Películas o usuarios parecidos quedan cerca en ese espacio."], ["Modelo", "d = 128", "Dimensión de los vectores de usuario y de película."], ["Modelo", "Norma L2 / similitud coseno", "Los vectores se normalizan a longitud 1. Así el producto escalar es el coseno del ángulo entre ellos: 1 si apuntan igual, 0 si son perpendiculares. Es lo que mide cuánto encaja una película con un usuario."], ["Modelo", "Score", "Número que el modelo asigna a un par usuario–película: el producto escalar de sus vectores. Más alto = mejor encaje. Las recomendaciones son las películas de score más alto."], ["Modelo", "Torre de ítem", "Red que combina el contenido de la película (sinopsis, géneros, director, reparto, año, duración) y su identificador, y devuelve su vector."], ["Modelo", "Torre de usuario", "Red que toma la media ponderada de los vectores de las películas de las bolsas A y B del usuario, junto con indicadores (si la bolsa está vacía, cuántas películas) y devuelve su vector."], ["Modelo", "MiniLM (all-MiniLM-L6-v2)", "Modelo de lenguaje ya entrenado y congelado que convierte la sinopsis (más las palabras clave) en un vector de 384 números. No se reentrena."], ["Modelo", "EmbeddingBag", "Capa que convierte una lista de identificadores (los directores o los actores de una película) en la media de sus vectores aprendidos."], ["Modelo", "Dropout del ID (0,5)", "Durante el entrenamiento, en cada paso se anula con probabilidad 0,5 el identificador de cada película. Obliga al modelo a funcionar también solo con el contenido, necesario para películas sin valoraciones."], ["Modelo", "MLP / capa oculta / ReLU", "MLP (perceptrón multicapa): red de capas lineales con una función no lineal entre ellas. Aquí, dos capas con 256 neuronas ocultas. ReLU: la función que pone a 0 los valores negativos."], ["Modelo", "Pérdida contrastiva (softmax con negativos del lote)", "Función que el entrenamiento minimiza: para cada par usuario–película positivo, sube su score frente al de las demás películas del mismo lote, que actúan como ejemplos negativos."], ["Modelo", "logQ (corrección del sesgo de muestreo)", "Se resta a cada score el logaritmo de la popularidad de la película (log P(i)). Corrige que las películas populares aparecen más como negativos del lote y evita que el modelo aprenda solo popularidad."], ["Modelo", "Temperatura τ", "Parámetro que divide los scores antes del softmax. Con τ pequeña el modelo se concentra en separar lo mejor; con τ grande es más permisivo. Aquí τ = 0,05."], ["Modelo", "Lote (batch) / paso / época", "Lote: grupo de ejemplos que se procesan a la vez (4 096). Paso: una actualización del modelo con un lote. Época: pasada por todos los ejemplos de entrenamiento (unos 3 700 pasos en el conjunto completo)."], ["Modelo", "AdamW", "Algoritmo que ajusta los pesos del modelo para reducir la pérdida; Adam con regularización por decaimiento de pesos (weight decay 10⁻⁴)."], ["Modelo", "Tasa de aprendizaje (lr), calentamiento y decaimiento coseno", "lr: cuánto se mueven los pesos en cada paso (10⁻³ como máximo). Calentamiento: sube linealmente durante los primeros 200 pasos. Decaimiento coseno: baja suavemente hasta el 5 % al final."], ["Modelo", "Parada temprana (paciencia)", "Se evalúa en validación al final de cada época y se para si no mejora el Recall@200 durante 3 épocas seguidas. Evita sobreentrenar."], ["Modelo", "Checkpoint (mejor.pt / ultimo.pt)", "Archivo con los pesos del modelo y el estado del entrenamiento. mejor.pt es la época con mejor resultado en validación; ultimo.pt permite reanudar si el entrenamiento se corta."], ["Modelo", "Semilla", "Número que fija el azar del entrenamiento (inicialización de pesos y orden de los ejemplos). Cambiar de semilla mide cuánto depende el resultado de la suerte."], ["Métodos de referencia", "Popularidad", "Método sin personalización: recomienda a todos los usuarios las películas con más positivos en train, excluyendo las ya valoradas. Es la referencia más básica."], ["Métodos de referencia", "EASE", "«Embarrassingly Shallow Autoencoder» (Steck, 2019): modelo lineal sin red neuronal que aprende, con una fórmula cerrada, qué películas suelen valorarse juntas. Muy fuerte para su sencillez. Aquí con λ = 500 y sobre las 10 000 películas más populares."], ["Métodos de referencia", "λ de EASE", "Regularización de EASE: cuanto mayor, más se suaviza lo aprendido. No confundir con λ del MMR."], ["Métodos de referencia", "Azar", "Recomendar películas al azar entre las no valoradas. Marca el mínimo esperable."], ["Métodos de referencia", "Oráculo", "Recomendador imaginario que conoce las respuestas. Su resultado es el techo posible y sirve para comprobar que la métrica está bien calculada."], ["Métricas", "Top-k", "Las k películas con mejor score para un usuario, tras excluir las ya valoradas."], ["Métricas", "Recall@k", "De las películas relevantes de un usuario en esa partición, la fracción que aparece en su top-k. Va de 0 a 1; se promedia entre usuarios. Responde a «¿cuánto de lo que le gustaría encuentro?»."], ["Métricas", "NDCG@k", "Normalized Discounted Cumulative Gain: premia acertar y que el acierto esté arriba. Cada acierto en la posición p suma 1/log₂(p + 2); se divide por el máximo posible. De 0 a 1."], ["Métricas", "Techo de recall", "Máximo Recall@k alcanzable: media de min(k, nº de relevantes) / nº de relevantes. Si un usuario tiene más de k relevantes, ni un modelo perfecto llega a 1."], ["Métricas", "Cobertura@k", "Fracción del catálogo que aparece en el top-k de al menos un usuario evaluado. Cuanto mayor, más variedad global; una cobertura baja indica que se recomiendan siempre las mismas películas."], ["Métricas", "Novedad@k", "Media de −log₂ p(i) de las películas recomendadas, con p(i) la popularidad suavizada en train. Valores altos = recomienda películas poco populares."], ["Métricas", "Aciertos (hits@k), precisión@k, lift", "En la watchlist: aciertos = películas del top-k que están en ella; precisión = aciertos / k; lift = precisión dividida por la que tendría el azar (fracción de candidatos que están en la watchlist). Un lift de 30× es 30 veces mejor que el azar."], ["Métricas", "MMR (relevancia marginal máxima) y λ", "Reordenación que, en cada paso, elige la película con mejor equilibrio entre relevancia y diferencia con lo ya elegido: λ · relevancia − (1 − λ) · similitud máxima. λ = 1 mantiene el ranking original; menor λ da más variedad. Aquí λ = 0,7."], ["Estadística", "Media ± desviación típica", "Media de un resultado entre semillas y su desviación típica muestral (dividida por n − 1). Indica cuánto cambia el resultado al cambiar solo el azar del entrenamiento."], ["Estadística", "Bootstrap de usuarios", "Técnica para medir la incertidumbre: se repite 2 000 veces el cálculo con usuarios remuestreados con reemplazo y se observa cuánto varía la diferencia entre dos métodos."], ["Estadística", "Intervalo de confianza (IC) del 95 %", "Rango donde cae el 95 % de los remuestreos del bootstrap. Si el IC de una diferencia no contiene el 0, la diferencia no se explica por qué usuarios entraron en la muestra."], ["Estadística", "Diferencia pareada", "Diferencia calculada usuario a usuario (el mismo usuario con los dos métodos) y luego promediada. Es más precisa que comparar medias sueltas."], ["Ingeniería", "Fuga de datos (leakage)", "Error en el que el modelo usa, al entrenar o evaluar, información que no tendría en la práctica (por ejemplo, valoraciones posteriores a la que predice). Las comprobaciones del informe la descartan."], ["Ingeniería", "Invariante", "Propiedad que debe cumplirse siempre (por ejemplo, «las medias de usuario salen solo de train»). Se comprueba automáticamente sobre los datos reales."], ["Ingeniería", "Determinismo", "Dos ejecuciones con los mismos datos y el mismo modelo dan exactamente el mismo resultado."], ["Ingeniería", "CSR", "Formato compacto de matriz dispersa: guarda solo los elementos no nulos y dónde empieza cada fila. Así se guardan los historiales de millones de usuarios."], ["Ingeniería", "float32 / norma numérica", "Números decimales de 32 bits, los que usan el modelo y los ficheros exportados. Dos cálculos equivalentes pueden diferir en el último decimal (~10⁻⁶)."], ["Ingeniería", "Latencia", "Tiempo de respuesta, en milisegundos (ms): lo que tarda en producir las recomendaciones para un usuario."], ["Ingeniería", "Colab / GPU T4", "Entorno de Google donde se entrenó el modelo. La GPU T4 es la tarjeta gráfica gratuita que lo acelera: una época tarda unos 5,5 minutos."], ["Ingeniería", "Coherencia numpy / PyTorch", "Comprobación de que el vector de usuario calculado con PyTorch y con la reimplementación en numpy (la que usa la exportación a C) coincide hasta ~10⁻⁶."]], "grupos": ["Datos", "Modelo", "Métodos de referencia", "Métricas", "Estadística", "Ingeniería"]}</script>
<script>
const D=JSON.parse(document.getElementById('datos').textContent);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',tip=$('tip');
const COL={'Popularidad':'var(--c)','EASE':'var(--b)','Two-Tower':'var(--a)'},SC=['#2f5fd0','#d98324','#177a45','#b3261e','#7d4cc0'];
const f4=x=>x==null?'—':x.toFixed(4);
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a){const e=el('text',Object.assign({x,y},a||{}),p);e.textContent=s;return e}
function showTip(ev,html){tip.innerHTML=html;tip.style.display='block';tip.style.left=Math.min(ev.clientX+12,innerWidth-190)+'px';tip.style.top=(ev.clientY+12)+'px'}
function hideTip(){tip.style.display='none'}
$('sub').textContent='Generado el '+D.generado+' · '+D.semillas.length+' semilla(s): '+D.semillas.join(', ')+' · MovieLens 32M, catálogo de 23 335 películas';
const TS='Test: positivo (C2)',met=(s,m)=>(D.metodos[s]||{})[m];
// tiles
(function(){const r=met(TS,'Recall@200'),n=met(TS,'NDCG@20'),t=[];
 if(r){t.push(['Recall@200 (test) Two-Tower',f4(r['Two-Tower'].media)+(r['Two-Tower'].sd!=null?' ± '+r['Two-Tower'].sd.toFixed(4):''),'media entre semillas']);
  if(r.EASE!=null)t.push(['Recall@200 EASE',f4(r.EASE),'baseline fuerte, 10 000 películas']);t.push(['Recall@200 popularidad',f4(r['Popularidad']),'lo más visto en train'])}
 if(D.pruebas)t.push(['Pruebas automáticas',D.pruebas.pasados+' ok',D.pruebas.saltados+' saltadas · '+D.pruebas.fallos+' fallos']);
 $('tiles').innerHTML=t.map(x=>'<div class="card tile"><div class="l">'+x[0]+'</div><div class="n">'+x[1]+'</div><div class="l">'+x[2]+'</div></div>').join('')})();
// barras agrupadas
function barras(){const sec=$('selPart').value+': '+$('selDef').value,fam=$('selFam').value,ks=[10,20,50,200];
 const ms=ks.map(k=>fam+'@'+k).filter(m=>met(sec,m));const svg=$('barras');svg.innerHTML='';
 const L=50,R=800,T=16,B=36,H=300,names=['Popularidad','EASE','Two-Tower'].filter(n=>ms.some(m=>met(sec,m)[n]!=null));
 let mx=0;ms.forEach(m=>names.forEach(n=>{const v=met(sec,m)[n];const x=n=='Two-Tower'?v.media+(v.sd||0):v;if(x>mx)mx=x}));mx=Math.max(mx*1.08,1e-9);
 const y=v=>H-B-(v/mx)*(H-B-T);
 for(let i=0;i<=4;i++){const v=mx*i/4;el('line',{x1:L,x2:R,y1:y(v),y2:y(v),stroke:'var(--line)'},svg);txt(svg,L-6,y(v)+4,v.toFixed(2),{'text-anchor':'end'})}
 const gw=(R-L)/ms.length,bw=Math.min(34,gw/(names.length+1));
 ms.forEach((m,i)=>{const cx=L+gw*(i+.5);txt(svg,cx,H-B+18,m,{'text-anchor':'middle'});
  names.forEach((n,j)=>{const raw=met(sec,m)[n];if(raw==null)return;const v=n=='Two-Tower'?raw.media:raw,x=cx+(j-(names.length-1)/2)*(bw+4)-bw/2;
   const r=el('rect',{x,y:y(v),width:bw,height:H-B-y(v),fill:COL[n],rx:3},svg);
   if(n=='Two-Tower'&&raw.sd!=null){el('line',{x1:x+bw/2,x2:x+bw/2,y1:y(v-raw.sd),y2:y(v+raw.sd),stroke:'var(--fg)','stroke-width':1.5},svg)}
   r.onmousemove=ev=>showTip(ev,'<b>'+n+'</b> · '+m+'<br>'+f4(v)+(n=='Two-Tower'&&raw.sd!=null?' ± '+raw.sd.toFixed(4):''));r.onmouseleave=hideTip})});
 $('legM').innerHTML=names.map(n=>'<span><i style="background:'+COL[n]+'"></i>'+n+'</span>').join('');
 const rows=METRICAS.filter(m=>met(sec,m));let h='<tr><th>Métrica</th><th>Popularidad</th><th>EASE</th><th>Two-Tower</th></tr>';
 rows.forEach(m=>{const v=met(sec,m),tt=v['Two-Tower'],mx=Math.max(tt.media,v['Popularidad']==null?-1:v['Popularidad'],v.EASE==null?-1:v.EASE),B=(x,t)=>x!=null&&Math.abs(x-mx)<1e-12?'<b>'+t+'</b>':t;h+='<tr><td>'+m+'</td><td>'+B(v['Popularidad'],f4(v['Popularidad']))+'</td><td>'+B(v.EASE,f4(v.EASE))+'</td><td>'+B(tt.media,f4(tt.media))+(tt.sd!=null?' ± '+tt.sd.toFixed(4):'')+'</td></tr>'});$('tabM').innerHTML=h}
const METRICAS=["Recall@10", "Recall@20", "Recall@50", "Recall@200", "NDCG@10", "NDCG@20", "NDCG@50", "NDCG@200", "Cobertura@20", "Novedad@20"];['selPart','selDef','selFam'].forEach(i=>$(i).onchange=barras);barras();
// semillas
$('selSem').innerHTML=METRICAS.filter(m=>met(TS,m)).map(m=>'<option>'+m+'</option>').join('');$('selSem').value='Recall@200';
function sem(){const m=$('selSem').value,v=met(TS,m),svg=$('semillas');svg.innerHTML='';if(!v){return}
 const ss=Object.entries(v['Two-Tower'].semillas),vals=ss.map(x=>x[1]);if(v.EASE!=null)vals.push(v.EASE);if(v['Popularidad']!=null)vals.push(v['Popularidad']);
 let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo||hi*.1)*.15;lo-=pad;hi+=pad;const L=60,R=800,T=18,B=34,H=220,x=v=>L+(v-lo)/(hi-lo)*(R-L);
 for(let i=0;i<=5;i++){const t=lo+(hi-lo)*i/5;el('line',{x1:x(t),x2:x(t),y1:T,y2:H-B,stroke:'var(--line)'},svg);txt(svg,x(t),H-B+16,t.toFixed(3),{'text-anchor':'middle'})}
 const ref=(val,col,name,dy)=>{if(val==null)return;el('line',{x1:x(val),x2:x(val),y1:T,y2:H-B,stroke:col,'stroke-width':2,'stroke-dasharray':'5 4'},svg);txt(svg,x(val)+4,T+dy,name,{fill:col})};
 ref(v.EASE,'var(--b)','EASE',12);ref(v['Popularidad'],'var(--c)','Popularidad',26);
 const mean=v['Two-Tower'].media;el('line',{x1:x(mean),x2:x(mean),y1:T,y2:H-B,stroke:'var(--a)','stroke-width':2},svg);txt(svg,x(mean)+4,H-B-6,'media',{fill:'var(--a)'});
 ss.forEach(([s,val],i)=>{const cy=T+20+i*((H-B-T-30)/Math.max(ss.length,1));const c=el('circle',{cx:x(val),cy,r:6,fill:'var(--a)'},svg);txt(svg,x(val)+10,cy+4,'semilla '+s+' · '+f4(val));
  c.onmousemove=ev=>showTip(ev,'semilla '+s+'<br>'+m+' = '+f4(val));c.onmouseleave=hideTip});
 let h='<tr><th>Semilla</th><th>'+m+'</th></tr>';ss.forEach(([s,val])=>h+='<tr><td>'+s+'</td><td>'+f4(val)+'</td></tr>');
 h+='<tr><td><b>media ± desv.</b></td><td><b>'+f4(mean)+(v['Two-Tower'].sd!=null?' ± '+v['Two-Tower'].sd.toFixed(4):'')+'</b></td></tr>';$('tabS').innerHTML=h}
$('selSem').onchange=sem;sem();
// curvas
function cur(){const k=$('selCur').value,svg=$('curvas');svg.innerHTML='';const ss=Object.keys(D.curvas);if(!ss.length){svg.outerHTML='<p class="mut">Sin curvas de entrenamiento.</p>';return}
 const all=ss.flatMap(s=>D.curvas[s].map(p=>p[k]).filter(v=>v!=null));let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.1||.01;lo-=pad;hi+=pad;
 const maxE=Math.max(...ss.flatMap(s=>D.curvas[s].map(p=>p.epoca))),L=60,R=800,T=16,B=34,H=300,x=e=>L+(e-1)/(Math.max(maxE-1,1))*(R-L),y=v=>H-B-(v-lo)/(hi-lo)*(H-B-T);
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;el('line',{x1:L,x2:R,y1:y(v),y2:y(v),stroke:'var(--line)'},svg);txt(svg,L-6,y(v)+4,v.toFixed(3),{'text-anchor':'end'})}
 for(let e=1;e<=maxE;e++)txt(svg,x(e),H-B+16,e,{'text-anchor':'middle'});txt(svg,(L+R)/2,H-4,'época',{'text-anchor':'middle'});
 ss.forEach((s,i)=>{const pts=D.curvas[s].filter(p=>p[k]!=null);el('polyline',{points:pts.map(p=>x(p.epoca)+','+y(p[k])).join(' '),fill:'none',stroke:SC[i%5],'stroke-width':2,'stroke-linejoin':'round'},svg);
  pts.forEach(p=>{const c=el('circle',{cx:x(p.epoca),cy:y(p[k]),r:3.5,fill:SC[i%5]},svg);c.onmousemove=ev=>showTip(ev,'semilla '+s+' · época '+p.epoca+'<br>'+k+' = '+p[k].toFixed(4)+'<br>'+p.minutos+' min');c.onmouseleave=hideTip})});
 $('legC').innerHTML=ss.map((s,i)=>'<span><i style="background:'+SC[i%5]+'"></i>semilla '+s+'</span>').join('')}
$('selCur').onchange=cur;cur();
// bootstrap
(function(){const b=D.bootstrap;if(!b){$('boot').innerHTML='<span class="mut">No calculado en esta ejecución.</span>';return}
 const e=Object.entries(b.diferencias);let h='<p class="mut">'+b.n_usuarios+' usuarios de test · 2000 remuestreos · IC 95 %. Si el intervalo no contiene el 0, la diferencia no depende de qué usuarios entraron en la muestra.</p><div class="sc"><table><tr><th>Comparación</th><th>Métrica</th><th>Diferencia</th><th>IC 95 %</th><th>¿Excluye 0?</th></tr>';
